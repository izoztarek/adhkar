<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رفيق</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Arabic Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2C7BE5">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;

      /* 🔥 Background */
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Morning / Night themes */
    body.morning .overlay {
      background: rgba(255,255,255,0.88);
      color: #000;
    }

    body.night .overlay {
      background: rgba(0,0,0,0.65);
      color: #fff;
    }

    .overlay {
      border-radius: 24px;
      padding: 20px;
      max-width: 460px;
      margin: auto;
      backdrop-filter: blur(4px);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo img {
      width: 90px;
    }

    .settings {
      font-size: 22px;
      cursor: pointer;
    }

    .header {
      background: rgba(255,255,255,0.9);
      padding: 14px;
      border-radius: 16px;
      font-size: 22px;
      font-weight: 700;
      margin: 14px 0;
    }

    body.night .header {
      background: rgba(0,0,0,0.6);
    }

    audio {
      width: 100%;
      margin: 14px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 6px 0;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      color: white;
      cursor: pointer;
    }

    .primary { background:#2C7BE5; }
    .secondary { background:#198754; }
    .neutral { background:#6C757D; }

    .length-box {
      display: none;
      margin: 10px 0;
    }

    .length-box button {
      width: 48%;
      margin: 4px 1%;
    }

    #backBtn { display:none; }
  </style>
</head>

<body>

<div class="overlay">

  <!-- Top -->
  <div class="top-bar">
    <div class="logo">
      <img src="logo.png">
    </div>
    <div class="settings" onclick="toggleSettings()">⚙️</div>
  </div>

  <!-- Title -->
  <div id="title" class="header">اختر طول الذكر</div>

  <!-- Player -->
  <audio id="player" controls autoplay></audio>

  <!-- Length Settings -->
  <div id="lengthBox" class="length-box">
    <button class="secondary" onclick="setLength('short')">قصير</button>
    <button class="primary" onclick="setLength('medium')">متوسط</button>
  </div>

  <!-- Travel -->
  <button class="primary" onclick="playTravel()">🚗 دعاء السفر</button>

  <!-- Back -->
  <button id="backBtn" class="neutral" onclick="goBack()">↩️ رجوع للذكر</button>

</div>

<script>
  const hour = new Date().getHours();
  const body = document.body;
  const player = document.getElementById("player");
  const title = document.getElementById("title");
  const lengthBox = document.getElementById("lengthBox");
  const backBtn = document.getElementById("backBtn");

  // Theme
  if (hour >= 5 && hour < 17) {
    body.classList.add("morning");
  } else {
    body.classList.add("night");
  }

  let length = localStorage.getItem("length");

  function toggleSettings() {
    lengthBox.style.display =
      lengthBox.style.display === "block" ? "none" : "block";
  }

  function setLength(val) {
    localStorage.setItem("length", val);
    length = val;
    lengthBox.style.display = "none";
    playAuto();
  }

  function playAuto() {
    if (!length) {
      title.innerText = "اختر طول الذكر";
      lengthBox.style.display = "block";
      return;
    }

    let src = "";
    if (hour >= 4 && hour < 17) {
      src = `morning_${length}.mp3`;
      title.innerText = "أذكار الصباح";
    } else {
      src = `evening_${length}.mp3`;
      title.innerText = "أذكار المساء";
    }

    backBtn.style.display = "none";
    player.src = src;
    player.play();
  }

  function playTravel() {
    player.src = "travel.mp3";
    title.innerText = "دعاء السفر";
    backBtn.style.display = "block";
    player.play();
  }

  function goBack() {
    playAuto();
  }

  playAuto();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
  }
</script>

</body>
</html>
