<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رفيق</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Arabic Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 0;
      background: #000;
    }

    /* ========== WELCOME SCREEN ========== */
    #welcome {
      position: fixed;
      inset: 0;
      background-image: url('welcome-bg.jpg');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .welcome-overlay {
      background: rgba(0,0,0,0.65);
      color: white;
      text-align: center;
      padding: 24px;
      border-radius: 20px;
      width: 90%;
      max-width: 420px;
    }

    .welcome-overlay h2 {
      margin-top: 0;
      font-size: 24px;
    }

    .welcome-overlay p {
      font-size: 16px;
      line-height: 1.6;
    }

    .welcome-overlay input {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    .welcome-overlay button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 12px;
      border: none;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary { background:#2C7BE5; color:white; }
    .btn-secondary { background:#6c757d; color:white; }

    /* ========== MAIN APP ========== */
    #app {
      display: none;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

<!-- WELCOME SCREEN -->
<div id="welcome">
  <div class="welcome-overlay" id="welcomeStep1">
    <h2>👋 أهلاً بيك في رفيق</h2>
    <p>
      رفيق بيساعدك تفتكر الذكر من غير ما تفتكر<br>
      قرّب موبايلك… والذكر يشتغل تلقائيًا
    </p>
    <button class="btn-primary" onclick="showForm()">🎁 خد خصم 10%</button>
    <button class="btn-secondary" onclick="skipWelcome()">تخطي</button>
  </div>

  <div class="welcome-overlay" id="welcomeStep2" style="display:none;">
    <h2>🎁 كود خصم ليك</h2>
    <input type="text" id="name" placeholder="اسمك">
    <input type="tel" id="phone" placeholder="رقم الموبايل">
    <button class="btn-primary" onclick="submitForm()">استلم الكود</button>
  </div>

  <div class="welcome-overlay" id="welcomeStep3" style="display:none;">
    <h2>🎉 مبروك!</h2>
    <p>كود الخصم بتاعك:</p>
    <h3>RAFEEQ10</h3>
    <button class="btn-primary" onclick="finishWelcome()">ابدأ الاستخدام</button>
  </div>
</div>

<!-- MAIN APP PLACEHOLDER -->
<div id="app">
  <!-- هنا بيكمّل كود الأذكار بتاعك زي ما هو -->
</div>

<script>
  const welcomed = localStorage.getItem("welcomed");

  if (!welcomed) {
    document.getElementById("welcome").style.display = "flex";
  } else {
    document.getElementById("welcome").style.display = "none";
    document.getElementById("app").style.display = "block";
  }

  function showForm() {
    document.getElementById("welcomeStep1").style.display = "none";
    document.getElementById("welcomeStep2").style.display = "block";
  }

  function skipWelcome() {
    localStorage.setItem("welcomed", "true");
    document.getElementById("welcome").style.display = "none";
    document.getElementById("app").style.display = "block";
  }

  function submitForm() {
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;

    if (!name || !phone) {
      alert("من فضلك اكتب الاسم ورقم الموبايل");
      return;
    }

    // ⚠️ هنا بعدين نربط Google Form أو API
    console.log("Name:", name, "Phone:", phone);

    document.getElementById("welcomeStep2").style.display = "none";
    document.getElementById("welcomeStep3").style.display = "block";
  }

  function finishWelcome() {
    localStorage.setItem("welcomed", "true");
    document.getElementById("welcome").style.display = "none";
    document.getElementById("app").style.display = "block";
  }
</script>

</body>
</html>
