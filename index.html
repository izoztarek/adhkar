<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>أذكار</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c7be5">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #f7f7f7;
    }
    button {
      padding: 14px 22px;
      font-size: 17px;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      margin: 6px;
    }
    .blue { background:#2c7be5; }
    .gray { background:#6c757d; }
    .green { background:#198754; }

    audio {
      width: 100%;
      max-width: 400px;
      margin-top: 15px;
    }

    #backBtn { display:none; }
    #lengthBox { margin-top:20px; }
  </style>
</head>

<body>

  <h2 id="title">🔊 جاري التشغيل...</h2>

  <audio id="player" controls autoplay></audio>

  <div id="lengthBox" style="display:none;">
    <p>⏱️ اختر طول الذكر:</p>
    <button class="green" onclick="setLength('short')">قصير</button>
    <button class="blue" onclick="setLength('medium')">متوسط</button>
  </div>

  <br>

  <button class="blue" onclick="playTravel()">🚗 دعاء السفر</button>
  <br>
  <button id="backBtn" class="gray" onclick="goBack()">↩️ رجوع للذكر</button>

  <script>
    const hour = new Date().getHours();
    const player = document.getElementById("player");
    const title = document.getElementById("title");
    const backBtn = document.getElementById("backBtn");
    const lengthBox = document.getElementById("lengthBox");

    let length = localStorage.getItem("length");

    function setLength(value) {
      localStorage.setItem("length", value);
      length = value;
      lengthBox.style.display = "none";
      playAuto();
    }

    function playAuto() {
      if (!length) {
        title.innerText = "⏱️ اختر طول الذكر";
        lengthBox.style.display = "block";
        return;
      }

      let src = "";
      if (hour >= 4 && hour < 17) {
        src = `morning_${length}.mp3`;
        title.innerText = "🌅 أذكار الصباح";
        localStorage.setItem("lastMode", "morning");
      } else {
        src = `evening_${length}.mp3`;
        title.innerText = "🌙 أذكار المساء";
        localStorage.setItem("lastMode", "evening");
      }

      backBtn.style.display = "none";
      player.src = src;
      player.play();
    }

    function playTravel() {
      player.src = "travel.mp3";
      title.innerText = "🚗 دعاء السفر";
      backBtn.style.display = "inline-block";
      player.play();
    }

    function goBack() {
      playAuto();
    }

    playAuto();

    // تسجيل Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>

</body>
</html>
