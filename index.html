<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>رفيق</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Cairo',sans-serif;
}

/* ========== WELCOME ========== */
#welcome{
  position:fixed;
  inset:0;
  background:url('welcome-bg.jpg') center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.welcome-box{
  background:rgba(0,0,0,.75);
  color:#fff;
  padding:24px;
  border-radius:22px;
  width:90%;
  max-width:420px;
  text-align:center;
  transition:.3s;
}

.hidden{
  opacity:0;
  pointer-events:none;
  position:absolute;
}

.welcome-box input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  font-size:16px;
}

.welcome-box button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:none;
  border-radius:12px;
  font-size:17px;
  font-weight:600;
  cursor:pointer;
}

.btn-primary{background:#2C7BE5;color:#fff}
.btn-secondary{background:#6c757d;color:#fff}

.error{
  font-size:14px;
  color:#ffb3b3;
  display:none;
}

/* ========== APP ========== */
#app{
  display:none;
  min-height:100vh;
  background:url('bg.jpg') center/cover fixed no-repeat;
  padding:20px;
  text-align:center;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo img{width:90px}

.settings{
  font-size:22px;
  cursor:pointer;
}

.header{
  background:rgba(255,255,255,.9);
  padding:14px;
  border-radius:16px;
  font-size:22px;
  font-weight:700;
  margin:14px 0;
}

audio{
  width:100%;
  max-width:420px;
  margin:12px auto;
}

.app-btn{
  width:100%;
  max-width:420px;
  padding:14px;
  margin:6px auto;
  border:none;
  border-radius:14px;
  font-size:17px;
  font-weight:600;
  color:#fff;
  cursor:pointer;
}

.primary{background:#2C7BE5}
.secondary{background:#198754}
.neutral{background:#6C757D}

#lengthBox{display:none}
#backBtn{display:none}
</style>
</head>

<body>

<!-- ========== WELCOME ========= -->
<div id="welcome">

  <div class="welcome-box" id="step1">
    <h2>👋 أهلاً بيك في رفيق</h2>
    <p>قرّب موبايلك… الذكر يشتغل تلقائيًا</p>
    <button class="btn-primary" onclick="showForm()">🎁 خد خصم 10%</button>
    <button class="btn-secondary" onclick="skipWelcome()">تخطي</button>
  </div>

  <div class="welcome-box hidden" id="step2">
    <h2>🎁 استلم كود الخصم</h2>
    <input id="name" placeholder="اسمك">
    <input id="phone" placeholder="رقم الموبايل">
    <div id="formError" class="error"></div>
    <button class="btn-primary" onclick="submitForm()">استلم الكود</button>
  </div>

  <div class="welcome-box hidden" id="step3">
    <h2>🎉 مبروك!</h2>
    <p>كود الخصم بتاعك:</p>
    <h3>RAFEEQ10</h3>
    <button class="btn-primary" onclick="finishWelcome()">ابدأ الاستخدام</button>
  </div>

</div>

<!-- ========== APP ========= -->
<div id="app">

  <div class="top-bar">
    <div class="logo"><img src="logo.png"></div>
    <div class="settings" onclick="toggleSettings()">⚙️</div>
  </div>

  <div id="title" class="header">اختر طول الذكر</div>

  <audio id="player" controls autoplay></audio>

  <div id="lengthBox">
    <button class="app-btn secondary" onclick="setLength('short')">قصير</button>
    <button class="app-btn primary" onclick="setLength('medium')">متوسط</button>
  </div>

  <button class="app-btn primary" onclick="playTravel()">🚗 دعاء السفر</button>
  <button id="backBtn" class="app-btn neutral" onclick="goBack()">↩️ رجوع</button>

</div>

<script>
/* ===== START ===== */
if(localStorage.getItem("welcomed")){
  welcome.style.display="none";
  app.style.display="block";
}

/* ===== WELCOME ===== */
function showForm(){
  step1.classList.add("hidden");
  step2.classList.remove("hidden");
}

function skipWelcome(){
  localStorage.setItem("welcomed","true");
  welcome.style.display="none";
  app.style.display="block";
}

function submitForm(){
  const n=name.value.trim();
  const p=phone.value.trim();
  formError.style.display="none";

  if(n.length<2){
    formError.innerText="اكتب اسم صحيح";
    formError.style.display="block";
    return;
  }

  if(!/^01[0-2,5][0-9]{8}$/.test(p)){
    formError.innerText="رقم موبايل غير صحيح";
    formError.style.display="block";
    return;
  }

  step2.classList.add("hidden");
  step3.classList.remove("hidden");
}

function finishWelcome(){
  localStorage.setItem("welcomed","true");
  welcome.style.display="none";
  app.style.display="block";
}

/* ===== ADHKAR ===== */
const hour=new Date().getHours();
const player=document.getElementById("player");
const title=document.getElementById("title");
const backBtn=document.getElementById("backBtn");
let length=localStorage.getItem("length");

function toggleSettings(){
  lengthBox.style.display=lengthBox.style.display==="block"?"none":"block";
}

function setLength(l){
  localStorage.setItem("length",l);
  length=l;
  playAuto();
}

function playAuto(){
  if(!length){
    lengthBox.style.display="block";
    return;
  }
  let src="";
  if(hour>=4&&hour<17){
    src=`morning_${length}.mp3`;
    title.innerText="أذكار الصباح";
  }else{
    src=`evening_${length}.mp3`;
    title.innerText="أذكار المساء";
  }
  backBtn.style.display="none";
  player.src=src;
  player.play();
}

function playTravel(){
  player.src="travel.mp3";
  title.innerText="دعاء السفر";
  backBtn.style.display="block";
  player.play();
}

function goBack(){playAuto()}

playAuto();
</script>

</body>
</html>
