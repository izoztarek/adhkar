<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>رفيق</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:#fff;
  color:#111;
}

.app{
  min-height:100vh;
  padding:16px;
}

/* Top bar */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.logo img{width:75px}

.settings-btn{
  background:#000;
  color:#fff;
  border:none;
  border-radius:10px;
  padding:8px 12px;
  font-size:14px;
  cursor:pointer;
}

/* Header */
.header{
  margin:10px 0;
  padding:12px;
  border:1px solid #000;
  border-radius:14px;
  text-align:center;
  font-size:19px;
  font-weight:700;
}

/* Tracker */
.tracker{
  border:1px solid #000;
  border-radius:14px;
  padding:10px;
  font-size:13px;
  margin-bottom:10px;
}

.progress-bar{
  width:100%;
  height:6px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
  margin:6px 0;
}

.progress{
  height:100%;
  width:0%;
  background:#000;
}

/* First choice */
#firstChoice{
  border:1px solid #000;
  border-radius:16px;
  padding:14px;
  max-width:420px;
  margin:14px auto;
  text-align:center;
}

.choice-btn{
  width:100%;
  padding:14px;
  margin:6px 0;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:600;
  color:#fff;
  cursor:pointer;
}

.short{background:#000}
.medium{background:#444}

/* Buttons */
.btn{
  width:100%;
  max-width:420px;
  padding:14px;
  margin:6px auto;
  border:none;
  border-radius:14px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  display:block;
}

.primary{background:#000;color:#fff}
.secondary{background:#444;color:#fff}
.neutral{background:#777;color:#fff}
.locked{background:#ccc;color:#555}

audio{
  width:100%;
  max-width:420px;
  display:block;
  margin:12px auto;
}

/* Settings */
#settingsBox{
  display:none;
  border:1px solid #000;
  border-radius:16px;
  padding:14px;
  max-width:420px;
  margin:10px auto;
}

#backBtn{display:none}
hr{margin:12px 0}
</style>
</head>

<body>

<div class="app">

  <div class="top-bar">
    <div class="logo"><img src="logo.png"></div>
    <button class="settings-btn" onclick="toggleSettings()">إعدادات الذكر</button>
  </div>

  <!-- Tracker -->
  <div class="tracker">
    <strong>📊 انتظامك هذا الشهر</strong><br>
    <span id="progressText">0 / 30 يوم</span>
    <div class="progress-bar">
      <div id="progress" class="progress"></div>
    </div>
    <div id="motivation"></div>
  </div>

  <div id="title" class="header">جاري التحميل…</div>

  <!-- First time -->
  <div id="firstChoice">
    <strong>اختر طول الذكر</strong><br><br>
    <button class="choice-btn short" onclick="setFirstLength('short')">قصير</button>
    <button class="choice-btn medium" onclick="setFirstLength('medium')">متوسط</button>
  </div>

  <audio id="player" controls autoplay></audio>

  <div id="settingsBox"></div>

  <button class="btn primary" onclick="playTravel()">دعاء السفر</button>
  <button id="backBtn" class="btn neutral" onclick="goBack()">رجوع</button>

</div>

<script>
const player=document.getElementById("player");
const title=document.getElementById("title");
const firstChoice=document.getElementById("firstChoice");
const settingsBox=document.getElementById("settingsBox");
const backBtn=document.getElementById("backBtn");

let length=localStorage.getItem("length");
let reader=localStorage.getItem("reader")||"default";

/* ===== Tracker (High accuracy) ===== */
function currentMonth(){
  const d=new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1);
}

function updateTracker(){
  let data=JSON.parse(localStorage.getItem("rafiqTracker"));

  if(!data || data.month!==currentMonth()){
    data={
      month:currentMonth(),
      days:0,
      last:0
    };
  }

  const now=Date.now();
  const dayMs=24*60*60*1000;

  if(now-data.last>=dayMs){
    data.days++;
    data.last=now;
    localStorage.setItem("rafiqTracker",JSON.stringify(data));
  }

  renderTracker(data.days);
}

function renderTracker(days){
  const total=30;
  document.getElementById("progressText").innerText=`${days} / ${total} يوم`;
  document.getElementById("progress").style.width=
    Math.min((days/total)*100,100)+"%";

  let msg="🌱 بداية طيبة";
  if(days>=10) msg="💪 استمر";
  if(days>=20) msg="🏁 قربت تكمل";
  if(days>=30) msg="🌟 منتظم هذا الشهر";

  document.getElementById("motivation").innerText=msg;
}

/* ===== First choice ===== */
function setFirstLength(val){
  localStorage.setItem("length",val);
  length=val;
  firstChoice.style.display="none";
  playAuto();
}

/* ===== Settings ===== */
function toggleSettings(){
  if(settingsBox.style.display==="block"){
    settingsBox.style.display="none";
  }else{
    renderSettings();
    settingsBox.style.display="block";
  }
}

function renderSettings(){
  settingsBox.innerHTML=`
    <strong>طول الذكر</strong><br><br>
    <button class="btn primary" onclick="setLength('short')">قصير</button>
    <button class="btn secondary" onclick="setLength('medium')">متوسط</button>
  `;
}

function setLength(val){
  length=val;
  localStorage.setItem("length",val);
  settingsBox.style.display="none";
  playAuto();
}

/* ===== Playback ===== */
function playAuto(){
  if(!length){
    firstChoice.style.display="block";
    title.innerText="اختر طول الذكر";
    return;
  }

  firstChoice.style.display="none";
  const hour=new Date().getHours();
  let src="";

  if(hour>=4&&hour<17){
    src=`${reader}_morning_${length}.mp3`;
    title.innerText="أذكار الصباح";
  }else{
    src=`${reader}_evening_${length}.mp3`;
    title.innerText="أذكار المساء";
  }

  backBtn.style.display="none";
  player.src=src;
  player.play();
  updateTracker();
}

function playTravel(){
  player.src="travel.mp3";
  title.innerText="دعاء السفر";
  backBtn.style.display="block";
  player.play();
}

function goBack(){
  playAuto();
}

/* Init */
const saved=JSON.parse(localStorage.getItem("rafiqTracker"));
if(saved&&saved.month===currentMonth()){
  renderTracker(saved.days);
}
playAuto();
</script>

</body>
</html>
