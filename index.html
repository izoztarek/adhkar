<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>رفيق</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:#fff;
  color:#111;
}

.app{
  min-height:100vh;
  padding:16px;
  text-align:center;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.logo img{
  width:70px;
}

.settings-btn{
  font-size:13px;
  padding:6px 12px;
  border:1px solid #111;
  border-radius:12px;
  background:#fff;
  cursor:pointer;
}

.counter-box{
  border:1px solid #111;
  border-radius:14px;
  padding:10px;
  margin-bottom:12px;
  font-size:14px;
}

.progress{
  height:6px;
  background:#eee;
  border-radius:6px;
  margin-top:6px;
  overflow:hidden;
}

.progress span{
  display:block;
  height:100%;
  width:0%;
  background:#111;
}

.header{
  border:1px solid #111;
  padding:12px;
  border-radius:14px;
  font-size:20px;
  margin-bottom:10px;
}

audio{
  width:100%;
  max-width:420px;
  margin:12px auto;
}

.btn{
  width:100%;
  max-width:420px;
  padding:14px;
  margin:6px auto;
  border:1px solid #111;
  border-radius:14px;
  font-size:15px;
  background:#fff;
  cursor:pointer;
}

.btn.black{
  background:#111;
  color:#fff;
}

#lengthBox,
#settingsBox,
#backBtn{
  display:none;
}
</style>
</head>

<body>

<div class="app">

  <div class="top-bar">
    <div class="logo"><img src="logo.png" alt="Rafiق"></div>
    <div class="settings-btn" onclick="toggleSettings()">إعدادات الذكر</div>
  </div>

  <div class="counter-box">
    <div id="counterText"></div>
    <div class="progress">
      <span id="progressBar"></span>
    </div>
  </div>

  <div id="title" class="header">اختر طول الذكر</div>

  <audio id="player" controls></audio>

  <!-- اختيار الطول (أول مرة فقط) -->
  <div id="lengthBox">
    <button class="btn" onclick="setLength('short')">قصير</button>
    <button class="btn" onclick="setLength('medium')">متوسط</button>
  </div>

  <!-- إعدادات -->
  <div id="settingsBox">
    <button class="btn" onclick="setLength('short')">قصير</button>
    <button class="btn" onclick="setLength('medium')">متوسط</button>
  </div>

  <button class="btn black" onclick="playTravel()">دعاء السفر</button>
  <button id="backBtn" class="btn" onclick="goBack()">رجوع</button>

</div>

<script>
// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}

const player = document.getElementById("player");
const title = document.getElementById("title");
const lengthBox = document.getElementById("lengthBox");
const settingsBox = document.getElementById("settingsBox");
const backBtn = document.getElementById("backBtn");
const counterText = document.getElementById("counterText");
const progressBar = document.getElementById("progressBar");

let length = localStorage.getItem("length");

// ===== عداد الالتزام =====
function updateCounter(){
  const now = Date.now();
  const last = localStorage.getItem("lastListen");
  let days = parseInt(localStorage.getItem("days") || "0");

  if(!last){
    days = 1;
    localStorage.setItem("days", days);
    localStorage.setItem("lastListen", now);
  }else{
    const diff = now - parseInt(last);
    if(diff >= 24 * 60 * 60 * 1000){
      days++;
      localStorage.setItem("days", days);
      localStorage.setItem("lastListen", now);
    }
  }

  if(days > 30) days = 30;

  counterText.innerText = `التزامك هذا الشهر: ${days} من 30`;
  progressBar.style.width = `${(days/30)*100}%`;
}

// ===== إعدادات =====
function toggleSettings(){
  settingsBox.style.display =
    settingsBox.style.display === "block" ? "none" : "block";
}

// ===== اختيار الطول =====
function setLength(val){
  localStorage.setItem("length", val);
  length = val;
  lengthBox.style.display = "none";
  settingsBox.style.display = "none";
  playAuto();
}

// ===== تشغيل تلقائي =====
function playAuto(){
  updateCounter();

  if(!length){
    title.innerText = "اختر طول الذكر";
    lengthBox.style.display = "block";
    return;
  }

  const hour = new Date().getHours();
  let src = "";

  if(hour >= 4 && hour < 17){
    src = `morning_${length}.mp3`;
    title.innerText = "أذكار الصباح";
  }else{
    src = `evening_${length}.mp3`;
    title.innerText = "أذكار المساء";
  }

  backBtn.style.display = "none";
  player.src = src;
  player.play();
}

// ===== دعاء السفر =====
function playTravel(){
  player.src = "travel.mp3";
  title.innerText = "دعاء السفر";
  backBtn.style.display = "block";
  player.play();
}

// ===== رجوع =====
function goBack(){
  playAuto();
}

playAuto();
</script>

</body>
</html>
