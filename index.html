<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رفيق</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Arabic Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2C7BE5">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 24px;
      text-align: center;

      /* 🔥 Background Image */
      background-image: url('background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Overlay خفيف علشان النص يبان */
    .overlay {
      background: rgba(255,255,255,0.88);
      border-radius: 24px;
      padding: 20px;
      max-width: 460px;
      margin: auto;
    }

    .logo img {
      width: 100px;
      margin-bottom: 12px;
    }

    .header {
      background: white;
      padding: 14px;
      border-radius: 16px;
      font-size: 22px;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    audio {
      width: 100%;
      max-width: 420px;
      margin: 16px auto;
    }

    button {
      width: 100%;
      max-width: 420px;
      padding: 14px;
      margin: 6px 0;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      color: white;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .primary { background:#2C7BE5; }
    .secondary { background:#198754; }
    .neutral { background:#6C757D; }

    .icon {
      width: 24px;
      height: 24px;
    }

    .icon.big {
      width: 28px;
      height: 28px;
    }

    #lengthBox { margin: 12px 0; }
    #backBtn { display:none; }

    .length-btns {
      display: flex;
      gap: 10px;
    }

    .length-btns button {
      width: 50%;
    }
  </style>
</head>

<body>

  <div class="overlay">

    <!-- Logo -->
    <div class="logo">
      <img src="logo.png" alt="Rafeeq">
    </div>

    <!-- Header -->
    <div id="title" class="header">اختر طول الذكر</div>

    <!-- Player -->
    <audio id="player" controls autoplay></audio>

    <!-- Length Selection -->
    <div id="lengthBox">
      <div class="length-btns">
        <button class="secondary" onclick="setLength('short')">قصير</button>
        <button class="primary" onclick="setLength('medium')">متوسط</button>
      </div>
    </div>

    <!-- Travel -->
    <button class="primary" onclick="playTravel()">
      <img src="car.svg" class="icon big"> دعاء السفر
    </button>

    <!-- Back -->
    <button id="backBtn" class="neutral" onclick="goBack()">
      <img src="back.svg" class="icon"> رجوع للذكر
    </button>

  </div>

  <script>
    const hour = new Date().getHours();
    const player = document.getElementById("player");
    const title = document.getElementById("title");
    const backBtn = document.getElementById("backBtn");
    const lengthBox = document.getElementById("lengthBox");

    let length = localStorage.getItem("length");

    function setLength(val) {
      localStorage.setItem("length", val);
      length = val;
      playAuto();
    }

    function playAuto() {
      if (!length) {
        title.innerText = "اختر طول الذكر";
        return;
      }

      let src = "";
      if (hour >= 4 && hour < 17) {
        src = `morning_${length}.mp3`;
        title.innerText = "أذكار الصباح";
        localStorage.setItem("lastMode", "morning");
      } else {
        src = `evening_${length}.mp3`;
        title.innerText = "أذكار المساء";
        localStorage.setItem("lastMode", "evening");
      }

      backBtn.style.display = "none";
      player.src = src;
      player.play();
    }

    function playTravel() {
      player.src = "travel.mp3";
      title.innerText = "دعاء السفر";
      backBtn.style.display = "flex";
      player.play();
    }

    function goBack() {
      playAuto();
    }

    playAuto();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>

</body>
</html>
