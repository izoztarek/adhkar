<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رفيق</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Arabic Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      margin: 0;
      background: #000;
    }

    /* ================= WELCOME ================= */
    #welcome {
      position: fixed;
      inset: 0;
      background-image: url('welcome-bg.jpg');
      background-size: cover;
      background-position: center;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .welcome-box {
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 24px;
      border-radius: 22px;
      width: 90%;
      max-width: 420px;
      text-align: center;
    }

    .welcome-box h2 { margin-top: 0; }

    .welcome-box p {
      font-size: 16px;
      line-height: 1.6;
    }

    .welcome-box input {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    .welcome-box button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 12px;
      border: none;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary { background:#2C7BE5; color:white; }
    .btn-secondary { background:#6c757d; color:white; }

    /* ================= APP ================= */
    #app {
      display: none;
      padding: 20px;
      text-align: center;
      background: #F7F7F7;
      min-height: 100vh;
    }

    .logo img {
      width: 90px;
      margin-bottom: 10px;
    }

    .header {
      background: white;
      padding: 14px;
      border-radius: 16px;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    audio {
      width: 100%;
      max-width: 420px;
      margin: 14px auto;
    }

    button.app-btn {
      width: 100%;
      max-width: 420px;
      padding: 14px;
      margin: 6px auto;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      color: white;
      cursor: pointer;
    }

    .primary { background:#2C7BE5; }
    .secondary { background:#198754; }
    .neutral { background:#6C757D; }

    #lengthBox { margin: 12px 0; }
    #backBtn { display:none; }
  </style>
</head>

<body>

<!-- ================= WELCOME SCREEN ================= -->
<div id="welcome">

  <div class="welcome-box" id="step1">
    <h2>👋 أهلاً بيك في رفيق</h2>
    <p>
      رفيق بيساعدك تفتكر الذكر من غير ما تفتكر<br>
      قرّب موبايلك… والذكر يشتغل تلقائيًا
    </p>
    <button class="btn-primary" onclick="showForm()">🎁 خد خصم 10%</button>
    <button class="btn-secondary" onclick="skipWelcome()">تخطي</button>
  </div>

  <div class="welcome-box" id="step2" style="display:none;">
    <h2>🎁 استلم كود الخصم</h2>
    <input id="name" placeholder="اسمك">
    <input id="phone" placeholder="رقم الموبايل">
    <button class="btn-primary" onclick="submitForm()">استلم الكود</button>
  </div>

  <div class="welcome-box" id="step3" style="display:none;">
    <h2>🎉 مبروك!</h2>
    <p>كود الخصم بتاعك:</p>
    <h3>RAFEEQ10</h3>
    <button class="btn-primary" onclick="finishWelcome()">ابدأ الاستخدام</button>
  </div>

</div>

<!-- ================= APP ================= -->
<div id="app">

  <div class="logo">
    <img src="logo.png">
  </div>

  <div id="title" class="header">اختر طول الذكر</div>

  <audio id="player" controls autoplay></audio>

  <div id="lengthBox">
    <button class="app-btn secondary" onclick="setLength('short')">قصير</button>
    <button class="app-btn primary" onclick="setLength('medium')">متوسط</button>
  </div>

  <button class="app-btn primary" onclick="playTravel()">🚗 دعاء السفر</button>
  <button id="backBtn" class="app-btn neutral" onclick="goBack()">↩️ رجوع</button>

</div>

<script>
  /* ===== Welcome Logic ===== */
  if (!localStorage.getItem("welcomed")) {
    document.getElementById("welcome").style.display = "flex";
  } else {
    document.getElementById("app").style.display = "block";
  }

  function showForm() {
    step1.style.display = "none";
    step2.style.display = "block";
  }

  function skipWelcome() {
    localStorage.setItem("welcomed", "true");
    welcome.style.display = "none";
    app.style.display = "block";
  }

  function submitForm() {
    if (!name.value || !phone.value) {
      alert("اكتب الاسم ورقم الموبايل");
      return;
    }
    step2.style.display = "none";
    step3.style.display = "block";
  }

  function finishWelcome() {
    localStorage.setItem("welcomed", "true");
    welcome.style.display = "none";
    app.style.display = "block";
    window.scrollTo(0,0);
  }

  /* ===== Adhkar Logic ===== */
  const hour = new Date().getHours();
  const player = document.getElementById("player");
  const title = document.getElementById("title");
  const backBtn = document.getElementById("backBtn");

  let length = localStorage.getItem("length");

  function setLength(val) {
    localStorage.setItem("length", val);
    length = val;
    playAuto();
  }

  function playAuto() {
    if (!length) {
      title.innerText = "اختر طول الذكر";
      return;
    }

    let src;
    if (hour >= 4 && hour < 17) {
      src = `morning_${length}.mp3`;
      title.innerText = "أذكار الصباح";
    } else {
      src = `evening_${length}.mp3`;
      title.innerText = "أذكار المساء";
    }

    backBtn.style.display = "none";
    player.src = src;
    player.play();
  }

  function playTravel() {
    player.src = "travel.mp3";
    title.innerText = "دعاء السفر";
    backBtn.style.display = "block";
    player.play();
  }

  function goBack() {
    playAuto();
  }

  playAuto();
</script>

</body>
</html>
