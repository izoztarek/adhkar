<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>رفيق</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:url('bg.jpg') center/cover fixed no-repeat;
}

.app{
  min-height:100vh;
  padding:16px;
}

/* Top bar */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo img{width:80px}

.settings-btn{
  font-size:20px;
  background:rgba(255,255,255,.9);
  border:none;
  border-radius:12px;
  padding:8px 12px;
  cursor:pointer;
}

/* Header */
.header{
  margin:14px 0 8px;
  background:rgba(255,255,255,.92);
  padding:12px;
  border-radius:16px;
  text-align:center;
  font-size:20px;
  font-weight:700;
}

/* Tracker (small) */
.tracker{
  background:rgba(255,255,255,.9);
  border-radius:14px;
  padding:10px 12px;
  margin-bottom:12px;
  font-size:13px;
}

.progress-bar{
  width:100%;
  height:8px;
  background:#e5e5e5;
  border-radius:20px;
  overflow:hidden;
  margin:6px 0;
}

.progress{
  height:100%;
  width:0%;
  background:#2C7BE5;
}

/* Audio & buttons */
audio{
  width:100%;
  max-width:420px;
  display:block;
  margin:12px auto;
}

.btn{
  width:100%;
  max-width:420px;
  padding:14px;
  margin:6px auto;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:600;
  color:#fff;
  cursor:pointer;
  display:block;
}

.primary{background:#2C7BE5}
.secondary{background:#198754}
.neutral{background:#6C757D}
.locked{background:#bbb;color:#444}

/* Settings box */
#settingsBox{
  display:none;
  max-width:420px;
  margin:10px auto;
  background:rgba(255,255,255,.95);
  border-radius:16px;
  padding:14px;
}

hr{margin:12px 0}

#backBtn{display:none}
</style>
</head>

<body>

<div class="app">

  <div class="top-bar">
    <div class="logo"><img src="logo.png"></div>
    <button class="settings-btn" onclick="toggleSettings()">⚙️ إعدادات الذكر</button>
  </div>

  <!-- Tracker -->
  <div class="tracker">
    <strong>📊 التزامك:</strong>
    <span id="progressText">0 / 30</span>
    <div class="progress-bar">
      <div id="progress" class="progress"></div>
    </div>
    <div id="motivation"></div>
  </div>

  <div id="title" class="header">جاري التشغيل…</div>

  <audio id="player" controls autoplay></audio>

  <!-- Settings -->
  <div id="settingsBox"></div>

  <button class="btn primary" onclick="playTravel()">🚗 دعاء السفر</button>
  <button id="backBtn" class="btn neutral" onclick="goBack()">↩️ رجوع</button>

</div>

<script>
const player = document.getElementById("player");
const title = document.getElementById("title");
const settingsBox = document.getElementById("settingsBox");
const backBtn = document.getElementById("backBtn");

let length = localStorage.getItem("length");
let reader = localStorage.getItem("reader") || "default";

/* ===== Tracker ===== */
function monthKey(){
  const d=new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1);
}
function today(){
  return new Date().getDate().toString();
}
function isUnlocked(){
  const data=JSON.parse(localStorage.getItem("rafiqTracker"));
  return data && data.days.length>=30;
}

function trackListening(){
  let data=JSON.parse(localStorage.getItem("rafiqTracker"));
  if(!data || data.month!==monthKey()){
    data={month:monthKey(),days:[]};
  }
  if(!data.days.includes(today())){
    data.days.push(today());
    localStorage.setItem("rafiqTracker",JSON.stringify(data));
  }
  renderTracker(data.days.length);
}

function renderTracker(count){
  const total=30;
  document.getElementById("progressText").innerText=`${count} / ${total}`;
  document.getElementById("progress").style.width=
    Math.min((count/total)*100,100)+"%";

  let msg="";
  if(count<5) msg="🌱 بداية جميلة";
  else if(count<15) msg="💪 استمر";
  else if(count<30) msg="🏆 قربت تكمل";
  else msg="🌟 منتظم";

  document.getElementById("motivation").innerText=msg;
}

/* ===== Settings ===== */
function renderSettings(){
  const unlocked=isUnlocked();

  settingsBox.innerHTML=`
    <strong>⏱️ طول الذكر</strong><br><br>

    <button class="btn secondary" onclick="setLength('short')">قصير</button>
    <button class="btn primary" onclick="setLength('medium')">متوسط</button>

    <button class="btn ${unlocked?'primary':'locked'}"
      ${unlocked?"onclick=\"setLength('long')\"":"disabled"}>
      ${unlocked?"طويل":"🔒 طويل (30 يوم)"}
    </button>

    <button class="btn ${unlocked?'primary':'locked'}"
      ${unlocked?"onclick=\"setLength('verylong')\"":"disabled"}>
      ${unlocked?"طويل جدًا":"🔒 طويل جدًا (30 يوم)"}
    </button>

    <hr>

    <strong>🕋 القارئ</strong><br><br>

    <button class="btn primary" onclick="setReader('default')">
      الافتراضي
    </button>

    <button class="btn ${unlocked?'secondary':'locked'}"
      ${unlocked?"onclick=\"setReader('maher')\"":"disabled"}>
      ${unlocked?"ماهر المعيقلي":"🔒 ماهر المعيقلي"}
    </button>
  `;
}

function toggleSettings(){
  if(settingsBox.style.display==="block"){
    settingsBox.style.display="none";
  }else{
    renderSettings();
    settingsBox.style.display="block";
  }
}

/* ===== Actions ===== */
function setLength(val){
  length=val;
  localStorage.setItem("length",val);
  settingsBox.style.display="none";
  playAuto();
}

function setReader(val){
  reader=val;
  localStorage.setItem("reader",val);
  settingsBox.style.display="none";
  playAuto();
}

function playAuto(){
  if(!length){
    title.innerText="اختر طول الذكر من الإعدادات";
    return;
  }

  const hour=new Date().getHours();
  let src="";

  if(hour>=4 && hour<17){
    src=`${reader}_morning_${length}.mp3`;
    title.innerText="أذكار الصباح";
  }else{
    src=`${reader}_evening_${length}.mp3`;
    title.innerText="أذكار المساء";
  }

  backBtn.style.display="none";
  player.src=src;
  player.play();
  trackListening();
}

function playTravel(){
  player.src="travel.mp3";
  title.innerText="دعاء السفر";
  backBtn.style.display="block";
  player.play();
}

function goBack(){
  playAuto();
}

/* Init */
(function(){
  const data=JSON.parse(localStorage.getItem("rafiqTracker"));
  if(data && data.month===monthKey()){
    renderTracker(data.days.length);
  }
})();
playAuto();
</script>

</body>
</html>
