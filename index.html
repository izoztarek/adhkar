<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>رفيق</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:url('bg.jpg') center/cover fixed no-repeat;
}

.app{
  min-height:100vh;
  padding:20px;
  text-align:center;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo img{width:90px}

.header{
  background:rgba(255,255,255,.92);
  padding:14px;
  border-radius:16px;
  font-size:22px;
  font-weight:700;
  margin:14px 0;
}

audio{
  width:100%;
  max-width:420px;
  margin:12px auto;
}

.btn{
  width:100%;
  max-width:420px;
  padding:14px;
  margin:6px auto;
  border:none;
  border-radius:14px;
  font-size:17px;
  font-weight:600;
  color:#fff;
  cursor:pointer;
}

.primary{background:#2C7BE5}
.secondary{background:#198754}
.neutral{background:#6C757D}
.locked{background:#bbb;color:#444}

#settingsBox{display:none}
#backBtn{display:none}

/* Tracker */
.tracker{
  max-width:420px;
  margin:16px auto;
  background:rgba(255,255,255,.92);
  border-radius:16px;
  padding:14px;
}

.progress-bar{
  width:100%;
  height:12px;
  background:#e5e5e5;
  border-radius:20px;
  overflow:hidden;
  margin:10px 0;
}

.progress{
  height:100%;
  width:0%;
  background:#2C7BE5;
  transition:.4s;
}
</style>
</head>

<body>

<div class="app">

  <div class="top-bar">
    <div class="logo"><img src="logo.png"></div>
  </div>

  <div id="title" class="header">اختر طول الذكر</div>

  <audio id="player" controls autoplay></audio>

  <button class="btn neutral" onclick="toggleSettings()">إعدادات الذكر</button>

  <div id="settingsBox"></div>

  <button class="btn primary" onclick="playTravel()">🚗 دعاء السفر</button>
  <button id="backBtn" class="btn neutral" onclick="goBack()">↩️ رجوع</button>

  <!-- Tracker -->
  <div class="tracker">
    <strong>📊 التزامك هذا الشهر</strong>
    <div id="progressText">0 / 30 يوم</div>
    <div class="progress-bar">
      <div id="progress" class="progress"></div>
    </div>
    <p id="motivation"></p>
  </div>

</div>

<script>
const player = document.getElementById("player");
const title = document.getElementById("title");
const settingsBox = document.getElementById("settingsBox");
const backBtn = document.getElementById("backBtn");

let length = localStorage.getItem("length");
let reader = localStorage.getItem("reader") || "default";

/* ===== Tracker Helpers ===== */
function monthKey(){
  const d=new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1);
}
function today(){
  return new Date().getDate().toString();
}
function isUnlocked(){
  const data=JSON.parse(localStorage.getItem("rafiqTracker"));
  return data && data.days.length>=30;
}

/* ===== Tracker Logic ===== */
function trackListening(){
  let data=JSON.parse(localStorage.getItem("rafiqTracker"));
  if(!data || data.month!==monthKey()){
    data={month:monthKey(),days:[]};
  }
  if(!data.days.includes(today())){
    data.days.push(today());
    localStorage.setItem("rafiqTracker",JSON.stringify(data));
  }
  renderTracker(data.days.length);
}

function renderTracker(count){
  const total=30;
  document.getElementById("progressText").innerText=
    `${count} / ${total} يوم`;
  document.getElementById("progress").style.width=
    Math.min((count/total)*100,100)+"%";

  let msg="";
  const left=total-count;
  if(count<=5) msg="🌱 بداية جميلة، الذكر حياة للقلب";
  else if(count<=15) msg=`💪 باقي ${left} يوم وتكمل شهر ذكر`;
  else if(count<=25) msg="🕌 ثابت بإذن الله";
  else if(count<30) msg=`🏆 قربت توصل! باقي ${left} يوم`;
  else msg="🌟 تم فتح ميزات جديدة بسبب انتظامك";

  document.getElementById("motivation").innerText=msg;
}

/* ===== Settings UI ===== */
function renderSettings(){
  const unlocked=isUnlocked();

  settingsBox.innerHTML=`
    <div class="tracker">
      <strong>⏱️ طول الذكر</strong><br><br>

      <button class="btn secondary" onclick="setLength('short')">قصير</button>
      <button class="btn primary" onclick="setLength('medium')">متوسط</button>

      <button class="btn ${unlocked?'primary':'locked'}"
        ${unlocked?"onclick=\"setLength('long')\"":"disabled"}>
        ${unlocked?"طويل":"🔒 طويل (30 يوم)"}
      </button>

      <button class="btn ${unlocked?'primary':'locked'}"
        ${unlocked?"onclick=\"setLength('verylong')\"":"disabled"}>
        ${unlocked?"طويل جدًا":"🔒 طويل جدًا (30 يوم)"}
      </button>

      <hr>

      <strong>🕋 القارئ</strong><br><br>

      <button class="btn primary" onclick="setReader('default')">
        الافتراضي
      </button>

      <button class="btn ${unlocked?'secondary':'locked'}"
        ${unlocked?"onclick=\"setReader('maher')\"":"disabled"}>
        ${unlocked?"ماهر المعيقلي":"🔒 ماهر المعيقلي"}
      </button>
    </div>
  `;
}

/* ===== Actions ===== */
function toggleSettings(){
  if(settingsBox.style.display==="block"){
    settingsBox.style.display="none";
  }else{
    renderSettings();
    settingsBox.style.display="block";
  }
}

function setLength(val){
  length=val;
  localStorage.setItem("length",val);
  settingsBox.style.display="none";
  playAuto();
}

function setReader(val){
  reader=val;
  localStorage.setItem("reader",val);
  settingsBox.style.display="none";
  playAuto();
}

function playAuto(){
  if(!length){
    title.innerText="اختر طول الذكر";
    toggleSettings();
    return;
  }

  const hour=new Date().getHours();
  let src="";

  if(hour>=4 && hour<17){
    src=`${reader}_morning_${length}.mp3`;
    title.innerText="أذكار الصباح";
  }else{
    src=`${reader}_evening_${length}.mp3`;
    title.innerText="أذكار المساء";
  }

  backBtn.style.display="none";
  player.src=src;
  player.play();
  trackListening();
}

function playTravel(){
  player.src="travel.mp3";
  title.innerText="دعاء السفر";
  backBtn.style.display="block";
  player.play();
}

function goBack(){
  playAuto();
}

/* Init */
(function(){
  const data=JSON.parse(localStorage.getItem("rafiqTracker"));
  if(data && data.month===monthKey()){
    renderTracker(data.days.length);
  }
})();
playAuto();
</script>

</body>
</html>
