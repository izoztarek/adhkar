<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>رفيق — رفيقك في كل رحلة</title>
  <meta name="description" content="أذكار الصباح والمساء ودعاء الركوب والسفر — بلمسة واحدة من كارت رفيق في عربيتك.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F5F5F5" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <meta name="format-detection" content="telephone=no">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="رفيق">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_EG">
  <meta property="og:site_name" content="رفيق">
  <meta property="og:title" content="رفيق — رفيقك في كل رحلة">
  <meta property="og:description" content="أذكار الصباح والمساء ودعاء الركوب والسفر — بلمسة واحدة.">
  <meta property="og:url" content="https://landing.rafeeq.shop/">
  <meta property="og:image" content="https://landing.rafeeq.shop/assets/images/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preload" href="assets/fonts/plex-arabic-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/plex-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/content.js">
  <link rel="modulepreload" href="js/prayer.js">
  <link rel="modulepreload" href="js/progress.js">
  <link rel="modulepreload" href="js/storage.js">
  <link rel="modulepreload" href="js/player.js">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- أيقونات -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.8l10.2-6.8c.6-.4.6-1.2 0-1.6L9.6 4.4C8.9 3.9 8 4.4 8 5.2z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.2" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1.2" fill="currentColor"/></symbol>
    <!-- في الاتجاه العربي: "التالي" لليسار و"السابق" لليمين -->
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M18.5 6.3v11.4c0 .7-.8 1.1-1.4.7L9.3 13c-.6-.4-.6-1.4 0-1.8l7.8-5.6c.6-.4 1.4 0 1.4.7z" fill="currentColor"/><rect x="5" y="5.5" width="2.3" height="13" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M5.5 6.3v11.4c0 .7.8 1.1 1.4.7l7.8-5.4c.6-.4.6-1.4 0-1.8L6.9 5.6c-.6-.4-1.4 0-1.4.7z" fill="currentColor"/><rect x="16.7" y="5.5" width="2.3" height="13" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5M19 4v4h-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  </svg>

  <div class="app">
    <p class="demo-banner" id="demo-banner" hidden>نسخة تجريبية — المحتوى والصوت مؤقتين</p>

    <!-- ========== الرئيسية ========== -->
    <main class="view home" id="view-home">
      <header class="home__head">
        <span class="wordmark" aria-label="رفيق">رفيق</span>
        <p class="home__greet" id="greet"></p>
      </header>

      <button class="cta" id="main-cta" type="button">
        <span class="cta__eyebrow" id="cta-eyebrow"></span>
        <span class="cta__title" id="cta-title"></span>
        <span class="cta__action">
          <span class="cta__play" aria-hidden="true"><svg><use href="#i-play"/></svg></span>
          <span id="cta-action"></span>
        </span>
      </button>
      <button class="linkbtn home__restart" id="restart" type="button" hidden>ابدأ من الأول</button>

      <div class="travel" role="group" aria-label="أدعية الطريق">
        <button class="travel__btn" type="button" data-section="rukoob">
          <span class="travel__title">دعاء الركوب</span>
          <span class="travel__sub">لكل مشوار</span>
        </button>
        <button class="travel__btn" type="button" data-section="safar">
          <span class="travel__title">دعاء السفر</span>
          <span class="travel__sub">لطريق طويل</span>
        </button>
      </div>

      <footer class="home__foot">
        <button class="progress" id="progress" type="button" hidden aria-describedby="progress-meta">
          <span class="progress__label" id="progress-label"></span>
          <span class="bar" id="progress-bar" hidden><span class="bar__fill" id="progress-fill"></span></span>
          <span class="progress__meta" id="progress-meta"></span>
        </button>
        <p class="tagline" id="tagline">رفيقك في كل رحلة</p>
        <button class="linkbtn" id="switch" type="button"></button>
      </footer>
    </main>

    <!-- ========== التشغيل ========== -->
    <section class="view player" id="view-player" hidden aria-labelledby="pl-section">
      <header class="player__head">
        <button class="iconbtn" id="pl-close" type="button" aria-label="رجوع للرئيسية"><svg><use href="#i-close"/></svg></button>
        <div class="player__heading">
          <h1 class="player__section" id="pl-section"></h1>
          <p class="player__count" id="pl-count"></p>
        </div>
        <span class="iconbtn iconbtn--ghost" aria-hidden="true"></span>
      </header>

      <div class="player__body" aria-live="polite">
        <h2 class="player__title" id="pl-title"></h2>
        <p class="player__repeat" id="pl-repeat" hidden></p>
        <div class="player__text" id="pl-text" hidden></div>
        <p class="player__source" id="pl-source" hidden></p>
      </div>

      <div class="player__status" id="pl-status" hidden>
        <p id="pl-status-text"></p>
        <button class="pill" id="pl-retry" type="button"><svg aria-hidden="true"><use href="#i-retry"/></svg> جرّب تاني</button>
      </div>

      <footer class="player__foot">
        <p class="player__road">عينك على الطريق… وأنا بقرأ معاك</p>
        <div class="bar bar--player"><span class="bar__fill" id="pl-progress"></span></div>
        <div class="controls">
          <button class="iconbtn iconbtn--lg" id="pl-prev" type="button" aria-label="الذكر السابق"><svg><use href="#i-prev"/></svg></button>
          <button class="playbtn" id="pl-toggle" type="button" aria-label="إيقاف مؤقت">
            <svg class="playbtn__play"><use href="#i-play"/></svg>
            <svg class="playbtn__pause"><use href="#i-pause"/></svg>
          </button>
          <button class="iconbtn iconbtn--lg" id="pl-next" type="button" aria-label="الذكر التالي"><svg><use href="#i-next"/></svg></button>
        </div>
      </footer>
    </section>

    <!-- ========== النهاية ========== -->
    <section class="view done" id="view-done" hidden aria-labelledby="done-title">
      <div class="done__body">
        <h1 class="done__title" id="done-title"></h1>
        <p class="done__sub" id="done-sub"></p>

        <div class="done__target" id="done-target" hidden>
          <p class="done__question" id="done-question">تحب تحط لنفسك هدف؟</p>
          <div class="chips" id="done-chips"></div>
          <button class="linkbtn" id="done-later" type="button">مش دلوقتي</button>
        </div>

        <button class="pill" id="install" type="button" hidden>ثبّت رفيق على الشاشة الرئيسية</button>
      </div>
      <button class="cta cta--small" id="done-ok" type="button"><span class="cta__title">تمام</span></button>
    </section>

    <!-- ========== الإعدادات ========== -->
    <div class="sheet" id="sheet" hidden>
      <div class="sheet__backdrop" data-close></div>
      <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <header class="sheet__head">
          <h2 id="sheet-title">أيامك مع رفيق</h2>
          <button class="iconbtn" type="button" data-close aria-label="قفل"><svg><use href="#i-close"/></svg></button>
        </header>

        <p class="sheet__summary" id="sheet-summary"></p>

        <h3 class="sheet__label">هدفك</h3>
        <div class="chips" id="sheet-chips"></div>
        <form class="field" id="target-form">
          <label class="visually-hidden" for="target-input">عدد أيام تختاره</label>
          <input id="target-input" type="number" inputmode="numeric" min="1" max="1000" placeholder="رقم تاني">
          <button class="pill" type="submit">حفظ</button>
        </form>

        <h3 class="sheet__label"><label for="name-input">اسمك <span class="muted">(اختياري)</span></label></h3>
        <input class="input" id="name-input" type="text" maxlength="40" autocomplete="given-name" enterkeyhint="done">

        <button class="linkbtn linkbtn--quiet" id="reset" type="button">ابدأ العدّ من جديد</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <pre class="debug" id="debug" hidden></pre>
  </div>

  <noscript>
    <p class="noscript">رفيق محتاج JavaScript يكون شغال في المتصفح.</p>
  </noscript>
</body>
</html>
